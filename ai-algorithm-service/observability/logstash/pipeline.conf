input {
  file {
    path => "/docker/containers/*/*-json.log"
    start_position => "end"
    ignore_older => "12h"
    close_older => "10m"
    sincedb_path => "/usr/share/logstash/data/sincedb-docker-json"
    codec => json
  }
}

filter {
  if [log] {
    mutate {
      rename => { "log" => "message" }
    }
  }

  if [time] {
    date {
      match => ["time", "ISO8601"]
      target => "@timestamp"
    }
  }

  if [message] {
    json {
      source => "message"
      target => "app"
      tag_on_failure => []
    }
  }

  if !([app][logger] and [app][logger] == "ai_algo_service") {
    drop { }
  }

  if [attrs][com.docker.compose.service] {
    mutate {
      add_field => { "[service][name]" => "%{[attrs][com.docker.compose.service]}" }
    }
  } else if [app][service_name] {
    mutate {
      add_field => { "[service][name]" => "%{[app][service_name]}" }
    }
  }

  if [service][name] and !([service][name] in ["ai-runtime", "ai-ops"]) {
    drop { }
  }

  if [app][time] {
    date {
      match => ["[app][time]", "ISO8601"]
      target => "@timestamp"
    }
  }

  if [app][level] and [app][level] == "DEBUG" {
    drop { }
  }

  if [app][level] {
    mutate {
      copy => { "[app][level]" => "[log][level]" }
    }
  }

  if [app][service_role] {
    mutate {
      copy => { "[app][service_role]" => "[service][role]" }
    }
  }

  if [app][http_path] in ["/metrics", "/health", "/ready"] {
    drop { }
  }

  if [message] =~ /"GET \/(metrics|health|ready)(\?[^ ]*)? HTTP\/[0-9.]+"\s+[0-9]{3}/ {
    drop { }
  }

  if [app][request_id] {
    mutate {
      copy => { "[app][request_id]" => "request_id" }
    }
  }

  if [app][event] {
    mutate {
      copy => { "[app][event]" => "[event][action]" }
    }
  }

  if [app][event_status] {
    mutate {
      copy => { "[app][event_status]" => "[event][status]" }
    }
  }

  if [app][trace_step] {
    mutate {
      copy => { "[app][trace_step]" => "[trace][step]" }
    }
  }

  if [app][http_method] {
    mutate {
      copy => { "[app][http_method]" => "[http][request][method]" }
    }
  }

  if [app][http_path] {
    mutate {
      copy => { "[app][http_path]" => "[url][path]" }
    }
  }

  if [app][http_status] {
    mutate {
      copy => { "[app][http_status]" => "[http][response][status_code]" }
      convert => { "[http][response][status_code]" => "integer" }
    }
  }

  if [app][latency_ms] {
    mutate {
      copy => { "[app][latency_ms]" => "[event][duration_ms]" }
      convert => { "[event][duration_ms]" => "integer" }
    }
  }

  if [app][duration_ms] {
    mutate {
      copy => { "[app][duration_ms]" => "[event][step_duration_ms]" }
      convert => { "[event][step_duration_ms]" => "integer" }
    }
  }

  if [app][area_id] {
    mutate {
      copy => { "[app][area_id]" => "area_id" }
      convert => { "area_id" => "integer" }
    }
  }

  if [app][network_id] {
    mutate {
      copy => { "[app][network_id]" => "network_id" }
    }
  }

  if [app][bundle_id] {
    mutate {
      copy => { "[app][bundle_id]" => "bundle_id" }
    }
  }

  if [app][error_code] {
    mutate {
      copy => { "[app][error_code]" => "error_code" }
    }
  }

  grok {
    match => { "path" => "/docker/containers/%{DATA:container_id}/%{DATA}.log" }
    tag_on_failure => []
  }

  mutate {
    remove_field => [
      "[attrs]",
      "[host]",
      "[stream]",
      "[event][original]"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ai-service-logs"
    ilm_enabled => false
  }
}
